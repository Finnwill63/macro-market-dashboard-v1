ai_analysis:
  model: claude-sonnet-4-6
  persona: "market strategist advising a Helsinki-based investor in Nordic-Baltic seed-stage companies"
  input: data/ai_context.json + data/scenario_state.json
  contract: must cite series and horizon; may not contradict computed bands;
            must return "no signal found" rather than fill a section

# macro-market-dashboard — series manifest v0.3
#
# v0.3 replaces the dead scraped sources. Stooq now sits behind a JavaScript
# proof-of-work wall, Finnhub moved candles to a paid tier, and Yahoo blocks
# scripted requests at the edge. Equities now come from Twelve Data's free
# tier as US-listed ETFs, with FRED's monthly OECD share-price series as a
# stale-but-present fallback.
#
# Providers:
#   fred        keyless
#   ecb_sdw     keyless
#   twelvedata  needs TD_KEY; 8 requests/minute, paced by the fetcher
#
# European equity ETFs are USD-denominated, so each has a derived EUR series.
# Track both: the gap between them is the currency contribution.

meta:
  version: 0.3
  updated: 2026-08-23
  verified: "all fred/ecb series and 8 twelvedata symbols returned live data 23 Aug 2026"

defaults:
  cadence: weekday
  history_years: 10
  fallback_policy: last_good_value

series:


# --------------------------------------------------------------------- derived
# EUR-terms equity series. USD price / (USD per EUR) = EUR price.
# No extra API calls — computed from series already fetched above.
derived:
  - {id: eq_nordic_finland_eur, from: eq_nordic_finland_usd, using: fx_eur_usd,
     label: Finland (MSCI proxy, EUR), category: equities.nordic, units: eur,
     note: "EFNL adjusted to EUR — strips the currency effect from the USD ETF",
     claims: [Q8, Q9]}
  - {id: eq_nordic_denmark_eur, from: eq_nordic_denmark_usd, using: fx_eur_usd,
     label: Denmark (MSCI proxy, EUR), category: equities.nordic, units: eur}
  - {id: eq_nordic_norway_eur, from: eq_nordic_norway_usd, using: fx_eur_usd,
     label: Norway (MSCI proxy, EUR), category: equities.nordic, units: eur}
  - {id: eq_nordic_sweden_eur, from: eq_nordic_sweden_usd, using: fx_eur_usd,
     label: Sweden (MSCI proxy, EUR), category: equities.nordic, units: eur}
  - {id: eq_eu_stoxx600_eur, from: eq_eu_stoxx600_usd, using: fx_eur_usd,
     label: Euro area (EZU, EUR), category: equities.eu, units: eur, claims: [Q8]}
  - {id: eq_eu_dax_eur, from: eq_eu_dax_usd, using: fx_eur_usd,
